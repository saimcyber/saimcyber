<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Saim Zaib, Cloud, DevOps and DevSecOps" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1f2937" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect x="640" width="560" height="300" fill="url(#grid)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#30363d"/>

  <!-- Text -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="118" fill="#f0f6fc" font-size="56" font-weight="700">Saim Zaib</text>
    <rect x="64" y="138" width="300" height="4" rx="2" fill="url(#line)"/>
    <text x="64" y="182" fill="#ff9900" font-size="22" font-weight="600">Cloud · DevOps · DevSecOps</text>
    <text x="64" y="214" fill="#8b949e" font-size="17">Pipelines that refuse to ship unscanned or unsigned images.</text>
    <text x="64" y="252" fill="#6e7681" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ terraform apply &amp;&amp; kubectl rollout status · Islamabad, PK</text>
  </g>

  <!-- Pipeline graph -->
  <g stroke="#30363d" stroke-width="2" fill="none">
    <path d="M720 150 L820 100"/>
    <path d="M720 150 L820 200"/>
    <path d="M820 100 L930 150"/>
    <path d="M820 200 L930 150"/>
    <path d="M930 150 L1040 105"/>
    <path d="M930 150 L1040 195"/>
    <path d="M1040 105 L1130 150"/>
    <path d="M1040 195 L1130 150"/>
  </g>
  <g stroke="url(#line)" stroke-width="2.5" fill="none" stroke-dasharray="6 8">
    <path d="M720 150 L820 100 L930 150 L1040 105 L1130 150">
      <animate attributeName="stroke-dashoffset" from="140" to="0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="930" cy="150" r="46" fill="url(#glow)"/>
  <g>
    <circle cx="720" cy="150" r="9" fill="#58a6ff"/>
    <circle cx="820" cy="100" r="8" fill="#ff9900"/>
    <circle cx="820" cy="200" r="8" fill="#ff9900"/>
    <circle cx="930" cy="150" r="11" fill="#2dd4bf"/>
    <circle cx="1040" cy="105" r="8" fill="#a371f7"/>
    <circle cx="1040" cy="195" r="8" fill="#a371f7"/>
    <circle cx="1130" cy="150" r="9" fill="#3fb950"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e7681" text-anchor="middle" letter-spacing="1.5">
    <text x="720" y="180">BUILD</text>
    <text x="820" y="80">SCAN</text>
    <text x="820" y="228">SBOM</text>
    <text x="930" y="188">SIGN</text>
    <text x="1040" y="85">ADMIT</text>
    <text x="1040" y="223">OBSERVE</text>
    <text x="1130" y="180">DEPLOY</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
